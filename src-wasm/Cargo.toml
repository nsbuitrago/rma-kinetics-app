[package]
name = "rma-kinetics-wasm"
version = "0.1.0"
authors = ["nsbuitrago"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rma-kinetics = { git = "https://github.com/nsbuitrago/rma-kinetics-rs", branch = "main", features = ["serde", "polars-wasm"] }
differential-equations = { version = "0.5.2", features = ["serde", "wasm"] }
getrandom = { version = "0.3", features = ["wasm_js"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Blob", "BlobPropertyBag", "Url", "Document", "Window", "HtmlAnchorElement"] }
js-sys = "0.3"
rma-kinetics-common = { path = "../src-common" }
polars = { version = "0.52", default-features = false, features = ["fmt_no_tty", "polars-io", "csv"] }
